<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8ff" />
  <title>LoveLive! 今日恋みくじ</title>
  <meta name="description" content="长按票根，抽出今天与你同台的 LoveLive! 学园偶像。" />
  <link rel="icon" href="data/covers_webp/muse.webp" />
  <link rel="preload" as="image" href="data/covers_webp/muse.webp" />
  <link rel="stylesheet" href="styles_v9.css?v=24" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="masthead">
      <button class="word-control" id="catalogOpen" type="button">MEMBERS</button>
      <a class="brand" href="#home" aria-label="返回首页">
        <span>LoveLive!</span>
        <strong>恋みくじ</strong>
      </a>
      <button class="word-control sound-toggle" id="soundToggle" type="button" aria-pressed="false">
        SOUND OFF
      </button>
    </header>

    <main id="home">
      <div class="screen-stack">
        <section class="home-screen" id="homeScreen" aria-label="今日恋签">
          <div class="edition">
            <p class="edition-kicker">SPECIAL ISSUE / 今日のステージ</p>
            <p class="cover-wordmark" aria-hidden="true">LoveLive!</p>
            <h1>
              <span>今日<span class="accent-type">恋</span>みくじ</span>
              <small>今日的应援，决定谁的故事发光！</small>
            </h1>
          </div>

          <div class="poster-layout">
            <div class="poster-stage" id="posterStage" aria-label="企划海报，可左右滑动切换，点击播放团歌">
              <div class="poster-stack" id="posterStack"></div>
              <div class="poster-meta">
                <p class="poster-caption" id="posterCaption"></p>
                <p class="audio-status" id="audioStatus">点击海报播放团歌</p>
                <span class="audio-progress" aria-hidden="true"><i id="audioProgress"></i></span>
              </div>
            </div>

            <nav class="series-index" id="seriesIndex" aria-label="企划索引"></nav>
          </div>

          <div class="ticket-zone">
            <label class="cn-field" for="cnInput">
              <span>还不快填上cn来一发？</span>
              <input id="cnInput" maxlength="24" autocomplete="nickname" placeholder="例如：虎子" />
            </label>

            <button class="draw-ticket" id="drawTicket" type="button">
              <span class="ticket-copy">
                <small>ADMIT ONE / 今日应援票</small>
                <strong>拉拉人不灭！</strong>
              </span>
              <span class="ticket-status" id="holdHint">（按住 0.5 秒开签）</span>
              <span class="ticket-progress" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <section class="result-screen" id="resultScreen" aria-hidden="true">
          <article class="result-ticket" id="resultTicket">
            <header class="result-heading">
              <p><span id="resultSeries"></span><span id="resultSlipNo"></span></p>
              <div class="result-title" aria-hidden="true">
                <strong>御<br />神<br />签</strong>
                <span>◆<br />签幕揭晓<br />◆</span>
              </div>
            </header>

            <section class="omikuji-stage">
              <div class="omikuji-curtain omikuji-curtain-left" aria-hidden="true">
                <strong>大</strong>
                <span>吉</span>
              </div>
              <div class="omikuji-curtain omikuji-curtain-right" aria-hidden="true">
                <strong>吉</strong>
                <span>祥</span>
              </div>

              <div class="poem-section">
                <h3>签诗</h3>
                <p class="poem-lines" id="resultPoem"></p>
              </div>

              <div class="portrait-column">
                <div class="character-art-wrap">
                  <img id="resultArt" alt="" loading="eager" fetchpriority="high" decoding="async" />
                </div>
                <div class="result-copy">
                  <p class="fortune-rank" id="fortuneRank">大吉</p>
                  <p class="result-keyword" id="resultKeyword"></p>
                  <h2 id="resultName"></h2>
                  <p class="result-jp" id="resultJp"></p>
                  <span class="result-cn" id="resultCn"></span>
                </div>
              </div>
            </section>

            <section class="fortune-body">
              <div class="oracle-section">
                <h3>断曰</h3>
                <p id="resultOracle"></p>
              </div>
              <div class="today-action">
                <span>今日行动</span>
                <p id="todayAction"></p>
              </div>
              <dl class="fortune-grid">
                <div><dt>愿望</dt><dd id="resultWish"></dd></div>
                <div><dt>待人</dt><dd id="resultPeople"></dd></div>
                <div><dt>出行</dt><dd id="resultTravel"></dd></div>
                <div><dt>学业</dt><dd id="resultStudy"></dd></div>
              </dl>
            </section>

            <section class="result-audio" id="resultAudio">
              <div>
                <span>今日曲目</span>
                <strong id="resultTrackTitle"></strong>
                <small id="resultAudioStatus">点击播放</small>
              </div>
              <button id="resultAudioToggle" type="button">播放</button>
              <span class="result-audio-progress" aria-hidden="true"><i id="resultAudioProgress"></i></span>
            </section>

            <details class="result-details">
              <summary>角色资料</summary>
              <dl>
                <div><dt>CV</dt><dd id="resultCv"></dd></div>
                <div><dt>属性</dt><dd id="resultTraits"></dd></div>
                <div><dt>代表曲</dt><dd id="resultSong"></dd></div>
                <div><dt>小知识</dt><dd id="resultTrivia"></dd></div>
              </dl>
            </details>

            <div class="result-actions">
              <a class="return-home" id="returnHome" href="#home">← 返回首页</a>
              <button id="againBtn" type="button">再来一签</button>
            </div>
          </article>
        </section>
      </div>
    </main>

    <section class="catalog-screen" id="catalogScreen" aria-hidden="false">
      <header class="catalog-heading">
        <div>
          <p>MEMBER INDEX</p>
          <h2>全员图鉴</h2>
        </div>
        <a class="close-word" id="catalogHome" href="#home">↑ 返回封面</a>
      </header>
      <nav class="catalog-tabs" id="catalogTabs" aria-label="图鉴企划"></nav>
      <div class="catalog-grid" id="catalogGrid"></div>
    </section>

    <div class="stage-flash" id="stageFlash" aria-hidden="true"></div>
    <div class="live-region" id="liveRegion" aria-live="polite"></div>
    <audio id="previewAudio" preload="none"></audio>
    <audio id="representativeAudio" preload="none"></audio>
  </div>

  <template id="posterTemplate">
    <figure class="poster-card">
      <img alt="" draggable="false" />
    </figure>
  </template>

  <template id="seriesButtonTemplate">
    <button class="series-button" type="button">
      <span class="series-number"></span>
      <span class="series-name"></span>
    </button>
  </template>

  <template id="catalogCardTemplate">
    <button class="catalog-card" type="button">
      <img alt="" loading="lazy" />
      <span class="catalog-card-copy">
        <strong></strong>
        <small></small>
      </span>
    </button>
  </template>

  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/gsap/Observer.min.js"></script>
  <script src="data/characters.js?v=24"></script>
  <script src="script_v9.js?v=25"></script>
</body>
</html>
